name: Test
on:
- push
- pull_request
- workflow_dispatch
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true
      - uses: actions/setup-dotnet@v2
        with:
          # https://dotnet.microsoft.com/en-us/download/dotnet
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Test LiveSPICE build
        shell: pwsh
        working-directory: LiveSPICE
        run: dotnet publish -c Release --framework net6.0-windows /p:DebugType=None /p:UseSharedCompilation=false  /p:UseRazorBuildServer=false
      - name: Test LiveSPICEVst build
        shell: pwsh
        working-directory: LiveSPICEVst
        run: dotnet publish -c Release --framework net8.0-windows /p:DebugType=None /p:UseSharedCompilation=false  /p:UseRazorBuildServer=false
      # Checking against Tests/Stats/*.csv is unconditional; --updateGolden regenerates.
      - name: Run circuit tests
        shell: pwsh
        working-directory: Tests
        run: dotnet run -c Release --framework net6.0-windows test "Circuits\*.schx"
      - name: Run examples
        shell: pwsh
        working-directory: Tests
        run: dotnet run -c Release --framework net6.0-windows test "Examples\*.schx"

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true
      - uses: actions/setup-dotnet@v2
        with:
          # https://dotnet.microsoft.com/en-us/download/dotnet
          dotnet-version: 8.0.x
      # LiveSPICE/LiveSPICEVst are WPF and can't build here; LiveSPICE.Core.sln is the
      # portable subset (Util, Audio, Circuit, ComputerAlgebra, Tests).
      - name: Build portable projects
        run: dotnet build LiveSPICE.Core.sln -c Release
      # Same unconditional assertion as the Windows job.
      - name: Run circuit tests
        working-directory: Tests
        run: dotnet run -c Release --framework net8.0 --no-build test "Circuits/*.schx"
      - name: Run examples
        working-directory: Tests
        run: dotnet run -c Release --framework net8.0 --no-build test "Examples/*.schx"
      # The live audio path needs a device, which CI runners don't have. The offline render path
      # exercises schematic load, solve, codegen and the buffer loop without one.
      - name: List audio devices
        working-directory: LiveSPICE.CLI
        run: dotnet run -c Release --no-build -- list
      - name: Render a circuit offline
        working-directory: LiveSPICE.CLI
        run: |
          dotnet run -c Release --no-build -- tone --output /tmp/tone.wav --frequency 82 --seconds 1
          dotnet run -c Release --no-build -- render \
            --schematic "../Tests/Examples/Passive 1stOrder Lowpass RC.schx" \
            --input /tmp/tone.wav --output /tmp/out.wav
      # The Avalonia GUI and its tests run headless (Avalonia.Headless.XUnit), so they work on
      # runners with no display or audio hardware.
      - name: Build Avalonia GUI
        run: dotnet build LiveSPICE.Linux.sln -c Release
      - name: Run Avalonia tests
        run: dotnet test LiveSPICE.Avalonia.Tests/LiveSPICE.Avalonia.Tests.csproj -c Release --no-build
